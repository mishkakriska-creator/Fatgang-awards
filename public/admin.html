<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="/style.css"><main><h2>Результаты FatGang</h2><form><input type="password" placeholder="Пароль администратора" required><button>Показать</button></form><pre></pre></main><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('input').value})});document.querySelector('pre').textContent=r.ok?JSON.stringify(await r.json(),null,2):'Доступ запрещён'}</script></html>
